name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Show versions
        run: |
          node --version
          npm --version
          npx ng version

      - name: Install dependencies
        run: npm ci

      - name: Check Browserslist
        run: |
          npm list browserslist caniuse-lite autoprefixer || true

      - name: Build Angular application
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          npx ng build \
            --configuration=production \
            --output-path=dist/site \
            --base-href="/"

      - name: Find build output
        id: output
        shell: bash
        run: |
          set -e

          echo "Checking Angular build output..."

          if [ -d "dist/site/browser" ]; then
            echo "Build directory: dist/site/browser"
            echo "publish_dir=dist/site/browser" >> "$GITHUB_OUTPUT"

          elif [ -d "dist/site" ]; then
            echo "Build directory: dist/site"
            echo "publish_dir=dist/site" >> "$GITHUB_OUTPUT"

          else
            echo "ERROR: Angular build output not found"
            find dist -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Add custom domain
        run: |
          echo "www.annaiaquatech.com" > "${{ steps.output.outputs.publish_dir }}/CNAME"

      - name: Display generated CNAME
        run: |
          cat "${{ steps.output.outputs.publish_dir }}/CNAME"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.publish_dir }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4