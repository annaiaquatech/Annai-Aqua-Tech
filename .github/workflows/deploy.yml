name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check versions
        run: |
          node -v
          npm -v
          npx ng version
          npm list browserslist caniuse-lite

      - name: Build Angular app
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          npx ng build \
            --configuration=production \
            --output-path=dist/site \
            --base-href="/"

      - name: Resolve publish directory
        id: resolve_publish_dir
        shell: bash
        run: |
          set -e

          publish_dir="dist/site/browser"

          if [ ! -d "$publish_dir" ]; then
            publish_dir="dist/site"
          fi

          echo "Publishing: $publish_dir"
          echo "publish_dir=$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Add custom domain
        run: |
          echo "www.annaiaquatech.com" > "${{ steps.resolve_publish_dir.outputs.publish_dir }}/CNAME"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.resolve_publish_dir.outputs.publish_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4